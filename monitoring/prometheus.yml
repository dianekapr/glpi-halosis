# Prometheus HaloSIS (NFR-09). Hanya aktif dengan: docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: halosis-ai
    static_configs:
      - targets: ['halosis-ai:8000']
  - job_name: mysql
    static_configs:
      - targets: ['mysqld-exporter:9104']
