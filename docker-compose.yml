# GLPI + MySQL untuk mencoba HaloSIS secara lokal.
# Jalankan: docker compose up -d   →   buka http://localhost:8080
services:
  glpi:
    # Dikunci ke 12.0.0: plugin halosis ditulis untuk API/hook versi ini
    image: "glpi/glpi:12.0.0"
    restart: unless-stopped
    env_file: .env
    environment:
      # Folder tema kustom di luar volume /var/glpi: mount di dalam /var/glpi/files membuat folder itu milik
      # root pada instalasi baru, sehingga installer GLPI gagal ("cannot create directory .../_cache")
      GLPI_THEMES_DIR: /var/glpi-themes
    depends_on:
      - db
      - keycloak
    ports:
      - "8080:80"
    volumes:
      - glpi_data:/var/glpi
      # Kode plugin HaloSIS dari repo ini (langsung terbaca tanpa build/copy)
      - ./plugins/halosis:/var/www/glpi/plugins/halosis
      # Palet tema kustom GLPI (folder GLPI_THEMES_DIR di atas)
      - ./themes:/var/glpi-themes:ro

  db:
    image: "mysql:8.4"
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  # Layanan AI HaloSIS (triase + chatbot). Plugin memanggilnya di http://halosis-ai:8000;
  # jika mati, plugin kembali ke mode dummy. Model & indeks dibuat dulu: lihat ai/README.md.
  halosis-ai:
    build: ./ai
    restart: unless-stopped
    environment:
      # Opsional: isi ANTHROPIC_API_KEY di .env agar jawaban chat dirangkum Claude; kosong = ekstraktif
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HALOSIS_CHAT_MIN_SCORE: ${HALOSIS_CHAT_MIN_SCORE:-0.83}
      # Skor di antara ini dan CHAT_MIN_SCORE → tawarkan judul artikel "Maksud Anda…?" (tanpa jawaban)
      HALOSIS_CHAT_SUGGEST_MIN_SCORE: ${HALOSIS_CHAT_SUGGEST_MIN_SCORE:-0.78}
    ports:
      # Hanya untuk dicek dari laptop (http://localhost:8001/health); GLPI memakai jaringan internal
      - "127.0.0.1:8001:8000"
    volumes:
      - ./ai/models:/app/models:ro
      # Bisa ditulis: artikel KB yang diterbitkan/dihapus memperbarui indeks (POST /reindex/artikel)
      - ./ai/index:/app/index
      # Log latensi per permintaan (NFR-12); laporan: ai/scripts/latency_report.py
      - ./ai/logs:/app/logs
      - hf_cache:/cache/huggingface

  # SSO lokal pengganti SSO BPS: GLPI memeriksa username & password ke Keycloak dari form login HaloSIS
  # (tanpa halaman login kedua). Realm "halosis" + akun uji diimpor dari keycloak/halosis-realm.json saat
  # pertama kali jalan. Konsol admin: http://localhost:8180 (admin/admin, HANYA untuk uji lokal).
  keycloak:
    image: "quay.io/keycloak/keycloak:26.4.2"
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/halosis-realm.json:/opt/keycloak/data/import/halosis-realm.json:ro
      - keycloak_data:/opt/keycloak/data

  # Penampung email lokal untuk uji notifikasi (BR-02, UC-03). HANYA untuk uji lokal, bukan server email produksi.
  # GLPI mengirim ke mailpit:1025 (jaringan internal compose); kotak masuk: http://localhost:8025
  mailpit:
    image: "axllent/mailpit:v1.20"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # Opsional (NFR-05): HTTPS lokal https://localhost:8443 lewat Caddy (sertifikat internal/self-signed).
  # Tidak ikut "docker compose up -d" biasa; aktifkan dengan: docker compose --profile tls up -d
  tls:
    image: "caddy:2.10.2"
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - glpi
    ports:
      - "8443:8443"
    volumes:
      - ./tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # Opsional (NFR-09): Prometheus + mysqld-exporter + Grafana (dashboard terprovisi), hanya untuk uji lokal.
  # Aktifkan: docker compose --profile monitoring up -d  →  Grafana http://localhost:3001 (admin/admin)
  prometheus:
    image: "prom/prometheus:v3.5.0"
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  mysqld-exporter:
    image: "prom/mysqld-exporter:v0.17.2"
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - db
    command: ["--mysqld.address=db:3306", "--mysqld.username=${GLPI_DB_USER}"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${GLPI_DB_PASSWORD}

  grafana:
    image: "grafana/grafana:12.1.0"
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/halosis.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  glpi_data:
  db_data:
  hf_cache:
  keycloak_data:
  caddy_data:
  prometheus_data:
  grafana_data:
